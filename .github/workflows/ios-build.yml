name: iOS Build (own team)

# Standalone iOS build for a self-hosted fork.
# The upstream `release-mobile.yml` depends on TOEVERYTHING's signing secrets
# and can't be reused; this workflow signs with our own Apple Developer team.
#
# Required repository secrets:
#   APPLE_STORE_CONNECT_API_KEY_ID   - App Store Connect API key ID
#   APPLE_STORE_CONNECT_API_ISSUER_ID- App Store Connect API issuer ID
#   APPLE_STORE_CONNECT_API_KEY      - base64 of the AuthKey_<id>.p8 file
# Optional:
#   BUILD_CERTIFICATE_BASE64         - base64 of a .p12 Apple Distribution cert
#   BUILD_CERTIFICATE_PASSWORD       - password of that .p12
#   (Without the p12, xcodebuild tries to obtain a certificate via
#    -allowProvisioningUpdates; if that fails, add the p12 secrets.)

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Bundle build type'
        required: true
        type: choice
        default: canary
        options:
          - canary
          - beta
          - stable
      upload-to-testflight:
        description: 'Upload the exported IPA to TestFlight'
        required: true
        type: boolean
        default: true
      marketing-version:
        description: 'CFBundleShortVersionString (leave empty to keep the project value)'
        required: false
        type: string
        default: ''
      build-number:
        description: 'CFBundleVersion (leave empty to use the GitHub run number)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  BUILD_TYPE: ${{ inputs.build-type }}
  APPLE_TEAM_ID: 8DQ2M68TNF
  APP_BUNDLE_ID: com.feihu1201.iaffine
  # The imported certificate is a distribution certificate whose CN starts with
  # "iPhone Distribution"; keep the identity string aligned with it.
  CODE_SIGN_IDENTITY_NAME: iPhone Distribution

jobs:
  build-web:
    name: Build web assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          playwright-install: false
          electron-install: false

      - name: Build iOS bundle
        env:
          PUBLIC_PATH: '/'
        run: yarn affine @affine/ios build

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: ios-dist
          path: packages/frontend/apps/ios/dist
          retention-days: 3

  build-ios:
    name: Build & sign IPA
    runs-on: macos-15
    timeout-minutes: 150
    needs:
      - build-web
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_STORE_CONNECT_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Download web assets
        uses: actions/download-artifact@v4
        with:
          name: ios-dist
          path: packages/frontend/apps/ios/dist

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/ios
          playwright-install: false
          electron-install: false
          hard-link-nm: false
          enableScripts: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Capacitor sync (runs pod install)
        run: yarn workspace @affine/ios sync

      - name: Setup Rust iOS target
        uses: ./.github/actions/build-rust
        with:
          target: aarch64-apple-ios
          package: affine_mobile_native
          no-build: 'true'

      - name: Import code signing certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APPLE_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 - "$RUNNER_TEMP/asc_key.json" <<'EOF'
          import json, os, sys
          with open(sys.argv[1], 'w') as f:
              json.dump({
                  'key_id': os.environ['ASC_KEY_ID'],
                  'issuer_id': os.environ['ASC_ISSUER_ID'],
                  'key': os.path.join(os.environ['RUNNER_TEMP'], 'private_keys',
                                      'AuthKey_%s.p8' % os.environ['ASC_KEY_ID']),
              }, f)
          EOF

      - name: Archive
        working-directory: packages/frontend/apps/ios/App
        env:
          MARKETING_VERSION: ${{ inputs.marketing-version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build-number }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${INPUT_BUILD_NUMBER:-${{ github.run_number }}}"
          MARKETING_SETTING=""
          if [ -n "${MARKETING_VERSION:-}" ]; then
            MARKETING_SETTING="MARKETING_VERSION=$MARKETING_VERSION"
          fi
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            $MARKETING_SETTING \
            archive

      - name: Export IPA
        working-directory: packages/frontend/apps/ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -l "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: affine-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload-to-testflight }}
        working-directory: packages/frontend/apps/ios/App
        run: |
          set -euo pipefail
          bundle config set --local path vendor/bundle
          bundle install
          bundle exec fastlane pilot upload \
            --ipa "$RUNNER_TEMP/export/App.ipa" \
            --app_identifier "$APP_BUNDLE_ID" \
            --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --skip_waiting_for_build_processing true
